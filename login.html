  <main class="container contato-pagina">
    <h1>Entrar</h1>
    <p>Digite seu usuário e sua senha para entrar.</p>

    <form class="formulario" id="form-login" novalidate>
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
      </div>

      <button type="submit" class="botao">Entrar</button>
      <p class="aviso" id="aviso" aria-live="polite"></p>
    </form>
  </main>

  <footer class="rodape">
