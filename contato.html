<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topo">
    <a href="index.html" class="topo"><span class="vermelho">D</span><span class="azul">a</span><span
        class="amarelo">n</span><span class="verde">i</span><span class="vermelho">e</span><span
        class="azul">l</span><span class="amarelo">.</span><span class="verde">D</span><span
        class="vermelho">e</span><span class="azul">v</span></a>
    <nav>
      <a href="login.html">Sair</a>
      <a href="index.html">Home</a>
      <button class="botao-tema" aria-label="Alternar tema da página">⚪</button>
    </nav>
    <button class="botao-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
  </header>

  <main class="container contato-pagina">
    <h1>Vamos conversar</h1>
    <p>Quer trocar uma ideia, mostrar um projeto? Preencha todos os campos</p>
    <form class="formulario" id="form-contato" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com">
      </div>
      <div class="campo">
        <label for="assunto">Assunto</label>
        <select id="assunto" name="assunto">
          <option value="">Escolha um assunto</option>
          <option value="projeto">Quero contratar um projeto</option>
          <option value="duvida">Tenho uma dúvida</option>
          <option value="outro">Outro assunto</option>
        </select>
      </div>
      <div class="campo">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem"></textarea>
      </div>
      <button type="submit" class="botao">Enviar mensagem</button>
      <p class="aviso" id="aviso" aria-live="polite"></p>
    </form>
  </main>

  <footer class="rodape">
    <h5>Daniel</h5>
    <h6>Feito com HTML e CSS</h6>
  </footer>

  <script src="layout.js"></script>
  <script src="contato.js"></script>"
</body>

</html>
